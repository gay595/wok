<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一只被抓捕的小韶八</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f4ff 0%, #ffffff 45%, #cce5ff 100%);
            color: #142850;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 24px;
        }
        .glass-window {
            width: 100%;
            max-width: 860px;
            border-radius: 18px;
            overflow: hidden;
            /* 窗口外层背景改为完全透明 */
            background: transparent;
            /* 细黑色边框 */
            border: 1px solid #222222;
            box-shadow: 0 30px 60px rgba(20, 40, 80, 0.18), 0 10px 25px rgba(20, 40, 80, 0.12);
            position: relative;
        }
        /* 删除原来彩色渐变伪元素边框 */
        .glass-window::before {
            display: none;
        }
        .glass-window::after {
            content: "";
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 20px;
            height: 26px;
            background: radial-gradient(ellipse at center, rgba(20, 40, 80, 0.12), transparent 70%);
            filter: blur(6px);
            pointer-events: none;
            z-index: 0;
        }
        .glass-titlebar {
            height: 44px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.72),
                rgba(226, 240, 255, 0.45)
            );
            border-bottom: 1px solid #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            position: relative;
            z-index: 2;
        }
        .glass-titlebar:active {
            cursor: grabbing;
        }
        .glass-title-text {
            font-size: 14px;
            letter-spacing: 3px;
            color: #1f3558;
            font-weight: 500;
            opacity: 0.85;
        }
        .glass-content {
            padding: 56px 48px 48px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 2.4rem;
            letter-spacing: 8px;
            text-align: center;
            color: #142850;
            margin-bottom: 36px;
            text-shadow: 0 2px 10px rgba(20, 40, 80, 0.12);
        }
        nav {
            text-align: center;
            margin-bottom: 44px;
        }
        nav a {
            color: #1f3558;
            text-decoration: none;
            font-size: 1.15rem;
            margin: 0 12px;
            padding: 10px 22px;
            border: 1px solid rgba(31, 53, 88, 0.22);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.45);
            transition: all 0.3s ease;
        }
        nav a:hover {
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(31, 53, 88, 0.45);
            box-shadow: 0 6px 20px rgba(20, 40, 80, 0.12);
        }
        .desc {
            font-size: 1.12rem;
            line-height: 2;
            text-align: center;
            color: #1f3558;
            opacity: 0.9;
        }
        footer {
            text-align: center;
            margin-top: 48px;
            font-size: 0.88rem;
            letter-spacing: 2px;
            color: #142850;
            opacity: 0.55;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="glass-window" id="glassWindow">
        <div class="glass-titlebar" id="dragBar">
            <div class="glass-title-text">跨越 · 韶八</div>
        </div>
        <div class="glass-content">
            <h1>跨越---韶八</h1>
            <nav>
                <a href="album.html">相册</a>
                <a href="ditie - 副本.html">地铁驾驶游戏</a>
            </nav>
            <p class="desc">
                抢铁U彩提示您，你已经到达抢铁南站
                <br>
            </p>
            <footer>
                &copy; 小扫把
            </footer>
        </div>
    </div>
    <script>
        const win = document.getElementById('glassWindow');
        const dragBar = document.getElementById('dragBar');
        let isDrag = false;
        let offsetX = 0;
        let offsetY = 0;
        dragBar.addEventListener('mousedown', function (e) {
            isDrag = true;
            const rect = win.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            win.style.position = 'absolute';
            win.style.left = rect.left + 'px';
            win.style.top = rect.top + 'px';
            win.style.margin = '0';
        });
        document.addEventListener('mousemove', function (e) {
            if (!isDrag) return;
            let newX = e.clientX - offsetX;
            let newY = e.clientY - offsetY;
            newX = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, newY));
            win.style.left = newX + 'px';
            win.style.top = newY + 'px';
        });
        document.addEventListener('mouseup', function () {
            isDrag = false;
        });
    </script>
</body>
</html>
